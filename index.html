<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI Agent Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root {
  color-scheme: light;
  --plane:   #f2f6f4;
  --surface: #ffffff;
  --ink:     #16211c;
  --ink-2:   #55655e;
  --ink-3:   #798a83;
  --hairline:#dfe8e4;
  --brand:   #135d4b;
  --ai:      #16a08c;
  --critical:#b02c2c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane:   #0e1512;
    --surface: #16201c;
    --ink:     #e8f0ec;
    --ink-2:   #a3b3ac;
    --ink-3:   #7d8d86;
    --hairline:#27342e;
    --brand:   #7fd8c4;
    --ai:      #1aa892;
    --critical:#e57373;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: var(--plane);
  color: var(--ink);
  font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.gate {
  width: 100%;
  max-width: 380px;
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 14px;
  padding: 28px;
}
.eyebrow {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--brand);
  margin: 0 0 6px;
}
h1 {
  font-family: Archivo, ui-sans-serif, system-ui, sans-serif;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0 0 6px;
}
p.sub { margin: 0 0 20px; color: var(--ink-2); font-size: 13.5px; }
.row { display: flex; align-items: baseline; justify-content: space-between; }
.linkish {
  width: auto;
  margin: 0;
  padding: 0;
  background: none;
  border: 0;
  color: var(--ai);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
.linkish:hover { filter: none; text-decoration: underline; }
label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-2);
  margin-bottom: 6px;
}
input {
  width: 100%;
  padding: 11px 12px;
  font: inherit;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 14px;
  color: var(--ink);
  background: var(--plane);
  border: 1px solid var(--hairline);
  border-radius: 9px;
}
input:focus { outline: 2px solid var(--ai); outline-offset: 1px; border-color: transparent; }
button {
  width: 100%;
  margin-top: 12px;
  padding: 11px 12px;
  font: inherit;
  font-weight: 500;
  color: #fff;
  background: var(--ai);
  border: 0;
  border-radius: 9px;
  cursor: pointer;
}
button:hover { filter: brightness(1.06); }
button[disabled] { opacity: 0.6; cursor: default; }
.msg { margin: 12px 0 0; font-size: 13px; min-height: 19px; }
.msg.error { color: var(--critical); }
.msg.working { color: var(--ink-2); }
.foot {
  margin: 18px 0 0;
  padding-top: 14px;
  border-top: 1px solid var(--hairline);
  font-size: 11.5px;
  color: var(--ink-3);
}
</style>
</head>
<body>
<main class="gate">
  <p class="eyebrow">Private dashboard</p>
  <h1>AI Agent Performance</h1>
  <p class="sub">This dashboard is encrypted. Enter the passphrase to open it.</p>
  <form id="f" autocomplete="off">
    <div class="row">
      <label for="pw">Passphrase</label>
      <button type="button" id="reveal" class="linkish">Show</button>
    </div>
    <input id="pw" type="password" autocomplete="off" autocapitalize="none" autocorrect="off"
           spellcheck="false" enterkeyhint="go" autofocus>
    <button id="go" type="submit">Unlock</button>
  </form>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <p class="foot">Decrypted in your browser. The passphrase is never sent anywhere.</p>
</main>

  function bytes(b64) {
    var raw = atob(b64), out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  /* Phones and chat apps mangle a pasted passphrase in predictable ways: a
     trailing space, an autocapitalised first letter, a zero-width character,
     an en-dash swapped in for a hyphen. Each one is a silent wrong password,
     so try the cleaned-up readings too rather than making the reader hunt. */
  function readings(raw) {
    var v = raw.normalize ? raw.normalize("NFKC") : raw;
    v = v.replace(/[\u200B-\u200D\uFEFF]/g, "");   // zero-width
    v = v.replace(/[\u2010-\u2015\u2212]/g, "-");  // en/em dashes, minus sign
    v = v.replace(/\s+/g, "");                     // any whitespace, inside or out
    var out = [];
    [raw, v, v.toLowerCase()].forEach(function (candidate) {
      if (candidate && out.indexOf(candidate) === -1) out.push(candidate);
    });
    return out;
  }

  function decrypt(passphrase) {
    var enc = new TextEncoder();
    return crypto.subtle
      .importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: bytes(P.salt), iterations: P.iter, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.ct));
      })
      .then(function (plain) { return new TextDecoder().decode(plain); });
  }

  function tryAll(candidates) {
    var i = 0;
    function next() {
      if (i >= candidates.length) return Promise.reject();
      var candidate = candidates[i++];
      return decrypt(candidate).then(
        function (html) { return { html: html, passphrase: candidate }; },
        next);
    }
    return next();
  }

  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }

  function open(raw, quiet) {
    button.disabled = true;
    say("Decrypting…", "working");
    // Yield a frame so the message paints before PBKDF2 blocks the thread.
    setTimeout(function () {
      tryAll(readings(raw)).then(function (result) {
        try { sessionStorage.setItem(KEY, result.passphrase); } catch (e) {}
        show(result.html);
      }, function () {
        button.disabled = false;
        try { sessionStorage.removeItem(KEY); } catch (e) {}
        if (quiet) { say(""); return; }
        say("That passphrase does not open this page. Paste it again — \u201cShow\u201d "
            + "reveals what is in the box.", "error");
        input.select();
      });
    }, 30);
  }

  if (!window.crypto || !crypto.subtle) {
    say("This browser cannot decrypt the page. Open it over https.", "error");
    button.disabled = true;
    return;
  }

  reveal.addEventListener("click", function () {
    var hidden = input.type === "password";
    input.type = hidden ? "text" : "password";
    reveal.textContent = hidden ? "Hide" : "Show";
    input.focus();
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (input.value) open(input.value, false);
  });

  /* A passphrase in the link opens the page with nothing to type. The fragment
     is never sent to the server, so it stays out of GitHub's logs - but it is
     the passphrase, so the link is as sensitive as the passphrase itself.

     A fragment can also be an ordinary anchor - #sec-analysis from a deep link
     into the dashboard. That is indistinguishable from a passphrase until it
     fails to decrypt, so a failure here is silent, and the anchor is left in
     the URL for the page underneath. Only a fragment that actually opened the
     page is a secret, and only that one is stripped. */
  var fragment = "";
  try { fragment = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  if (fragment) {
    button.disabled = true;
    say("Decrypting…", "working");
    setTimeout(function () {
      tryAll(readings(fragment)).then(function (result) {
        try { sessionStorage.setItem(KEY, result.passphrase); } catch (e) {}
        try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
        show(result.html);
      }, function () {
        button.disabled = false;
        say("");
        input.focus();
      });
    }, 30);
    return;
  }

  var saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) open(saved, true);
})();
</script>
</body>
</html>
